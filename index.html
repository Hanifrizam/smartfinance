<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Legal Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --secondary: #0ea5e9;
            --bg-body: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%);
            color: var(--text-main); 
            height: 100vh;
            display: flex; 
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon-box {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white; font-size: 40px;
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
        }

        h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; line-height: 1.5; }

        .input-group { position: relative; margin-bottom: 25px; }
        .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 20px; }
        
        input {
            width: 100%; padding: 16px 16px 16px 48px;
            border-radius: 14px; border: 2px solid #e2e8f0;
            background: #f1f5f9; font-size: 15px; color: var(--text-main);
            transition: 0.3s; font-weight: 600; letter-spacing: 1px;
        }
        input:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        input::placeholder { color: #94a3b8; font-weight: 500; letter-spacing: normal; }

        .btn-submit {
            width: 100%; padding: 16px; border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; font-weight: 700; font-size: 16px;
            border: none; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(79, 70, 229, 0.4); }

        /* Toast Alert */
        #toast-container { position: fixed; top: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 15px; }
        .toast {
            background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 16px 20px; display: flex; align-items: center; gap: 15px;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative; overflow: hidden; width: 320px; text-align: left;
        }
        .toast-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #fee2e2; color: var(--danger); }
        .toast-content h4 { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .toast-content p { font-size: 12px; color: var(--text-muted); }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--danger); width: 100%; animation: progress 3.5s linear forwards; }
        .toast.fade-out { animation: fadeOutRight 0.4s ease forwards; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutRight { to { transform: translateX(100%); opacity: 0; } }
        @keyframes progress { to { width: 0%; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="login-card">
        <div class="icon-box">
            <i class="ph ph-scales"></i>
        </div>
        <h1>Corporate Help Center</h1>
        <p>Silakan masukkan kode referral autentikasi untuk mengakses Legal Dashboard.</p>

        <div class="input-group">
            <i class="ph ph-lock-key"></i>
            <input type="password" id="referralCode" placeholder="Masukkan Kode Referral..." autocomplete="off">
        </div>

        <button class="btn-submit" onclick="verifyCode()">Akses Dashboard <i class="ph ph-arrow-right" style="vertical-align: middle; margin-left: 5px;"></i></button>
    </div>

    <script>
        // KODE REFERRAL MASTER (Ganti jika diperlukan)
        const SECRET_CODE = "PVMI-LEGAL-DASHBOARD-AUTH-2026-X9Y8Z7";

        function verifyCode() {
            const input = document.getElementById('referralCode').value;
            const btn = document.querySelector('.btn-submit');
            
            if (input === SECRET_CODE) {
                // Beri efek loading
                btn.innerHTML = `<i class="ph ph-spinner ph-spin"></i> Memverifikasi...`;
                btn.style.opacity = '0.8';
                
                // Simpan kunci akses ke Session Storage browser
                sessionStorage.setItem('legal_auth_token', SECRET_CODE);
                
                // Pindah ke dashboard setelah 1 detik agar animasi terlihat smooth
                setTimeout(() => {
                    window.location.href = "legal.html";
                }, 1000);
            } else {
                showErrorToast("Akses Ditolak", "Kode referral yang Anda masukkan salah atau tidak valid.");
                document.getElementById('referralCode').value = ''; // Kosongkan input
            }
        }

        // Jalankan fungsi jika user menekan tombol "Enter" di keyboard
        document.getElementById("referralCode").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                verifyCode();
            }
        });

        // Helper fungsi notifikasi error
        function showErrorToast(title, message) {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast`;
            toast.innerHTML = `
                <div class="toast-icon"><i class="ph ph-warning-octagon"></i></div>
                <div class="toast-content"><h4>${title}</h4><p>${message}</p></div>
                <div class="toast-progress"></div>
            `;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                toast.addEventListener('animationend', () => toast.remove());
            }, 3500);
        }
    </script>
</body>
</html>
